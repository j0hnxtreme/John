<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOHN | Social Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Cinzel:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#833ab4,#fd1d1d,#fcb045,#23a6d5);
background-size:400% 400%;
animation:bg 10s ease infinite;
padding:20px;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:360px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
border-radius:25px;
padding:30px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,.3);
border:1px solid rgba(255,255,255,.2);
animation:fade .7s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
width:90px;
height:90px;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(45deg,#ff512f,#dd2476);
color:#fff;
font-size:40px;
margin-bottom:15px;
}

h1{
font-family:'Cinzel',serif;
font-size:42px;
letter-spacing:5px;
background:linear-gradient(45deg,#fff,#ffe082);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

p{
color:#fff;
margin-bottom:25px;
font-size:14px;
}

.social{
display:flex;
flex-direction:column;
gap:15px;
}

.social a{
text-decoration:none;
padding:15px;
border-radius:15px;
font-size:17px;
font-weight:600;
color:#fff;
transition:.3s;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
}

.social a:hover{
transform:scale(1.05);
}

.instagram{
background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
}

.facebook{
background:#1877F2;
}

.telegram{
background:#229ED9;
}

.freefire{
background:#ff6b00;
}

.youtube{
background:#FF0000;
}

.whatsapp{
background:#25D366;
}

.footer{
margin-top:25px;
color:#fff;
font-size:13px;
opacity:.9;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">
<i class="fas fa-user"></i>
</div>

<h1>JOHN</h1>

<p>Welcome to my Social Hub</p>

<div class="social">

<a class="instagram" href="https://instagram.com" target="_blank">
<i class="fab fa-instagram"></i>
Instagram
</a>

<a class="facebook" href="https://facebook.com" target="_blank">
<i class="fab fa-facebook-f"></i>
Facebook
</a>

<a class="telegram" href="https://t.me" target="_blank">
<i class="fab fa-telegram"></i>
Telegram
</a>

<a class="freefire" href="#">
🎮 Free Fire
</a>

<a class="youtube" href="https://youtube.com" target="_blank">
<i class="fab fa-youtube"></i>
YouTube
</a>

<a class="whatsapp" href="https://wa.me/" target="_blank">
<i class="fab fa-whatsapp"></i>
WhatsApp
</a>

</div>

<div class="footer">
© 2026 JOHN | All Rights Reserved
</div>

</div>

</body>
  </html>
