
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>JOHN | Social Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 25px 16px;
  font-family: 'DM Sans', sans-serif;
  color: white;
  background:
    radial-gradient(circle at 15% 15%, #39206a 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, #123b58 0%, transparent 35%),
    #080812;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 450px;
  padding: 30px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 28px;
  background: rgba(255,255,255,.055);
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 80px rgba(0,0,0,.5);
  animation: appear .8s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font: 700 19px 'Space Grotesk', sans-serif;
  letter-spacing: 3px;
}

.brand span { color: #a78bfa; }

.badge {
  font-size: 10px;
  letter-spacing: 2px;
  color: #c4b5fd;
  border: 1px solid #7653a9;
  border-radius: 30px;
  padding: 8px 12px;
}

.hero {
  text-align: center;
  padding: 42px 0 32px;
}

.avatar {
  width: 95px;
  height: 95px;
  margin: auto auto 20px;
  display: grid;
  place-items: center;
  border-radius: 28px;
  transform: rotate(-5deg);
  background: linear-gradient(135deg,#50318a,#151b38);
  border: 1px solid #b9a0ff;
  box-shadow: 0 10px 35px #673ab755;
  font: 700 48px 'Space Grotesk', sans-serif;
}

h1 {
  font: 700 43px 'Space Grotesk', sans-serif;
  letter-spacing: 8px;
}

.tagline {
  color: #aaa8be;
  font-size: 13px;
  line-height: 1.8;
  margin-top: 10px;
}

.section-title {
  color: #aaa8be;
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 15px;
}

.links {
  display: grid;
  gap: 13px;
}

.social {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px;
  min-height: 73px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 18px;
  background: rgba(255,255,255,.045);
  text-decoration: none;
  color: white;
  transition: .25s ease;
}

.social:hover {
  transform: translateY(-4px);
  border-color: #a78bfa;
  background: rgba(167,139,250,.12);
  box-shadow: 0 10px 30px #0004;
}

.icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 23px;
  background: rgba(255,255,255,.09);
}

.details { flex: 1; }

.name {
  display: block;
  font-size: 15px;
  font-weight: 700;
}

.handle {
  display: block;
  color: #aaa8be;
  font-size: 12px;
  margin-top: 4px;
}

.arrow {
  font-size: 21px;
  color: #bba9ff;
}

.footer {
  border-top: 1px solid rgba(255,255,255,.1);
  margin-top: 28px;
  padding-top: 20px;
  text-align: center;
  color: #77758d;
  font-size: 11px;
  letter-spacing: 1px;
}

@media(max-width:400px) {
  .container { padding: 23px 18px; }
}
</style>
</head>

<body>

<main class="container">

  <header class="header">
    <div class="brand">JOHN<span>.</span></div>
    <div class="badge">✦ PREMIUM</div>
  </header>

  <section class="hero">
    <div class="avatar">J</div>
    <h1>JOHN</h1>
    <p class="tagline">
      Welcome to my world.<br>
      Connect • Explore • Discover
    </p>
  </section>

  <section>
    <p class="section-title">FIND ME ONLINE</p>

    <div class="links">

      <a class="social"
         href="https://www.instagram.com/j0hnxtreme/"
         target="_blank" rel="noopener noreferrer">
        <div class="icon">📸</div>
        <div class="details">
          <span class="name">Instagram</span>
          <span class="handle">@j0hnxtreme</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a class="social"
         href="https://t.me/j0hnxtreme"
         target="_blank" rel="noopener noreferrer">
        <div class="icon">✈️</div>
        <div class="details">
          <span class="name">Telegram</span>
          <span class="handle">@j0hnxtreme</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a class="social"
         href="https://www.youtube.com/@technoeon"
         target="_blank" rel="noopener noreferrer">
        <div class="icon">▶️</div>
        <div class="details">
          <span class="name">YouTube</span>
          <span class="handle">@technoeon</span>
        </div>
        <span class="arrow">↗</span>
      </a>

    </div>
  </section>

  <footer class="footer">
    © 2026 JOHN · ALL RIGHTS RESERVED
  </footer>

</main>

</body>
</html>
